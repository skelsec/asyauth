[libdefaults]
	default_realm = @REALM@
	dns_lookup_kdc = false
	dns_lookup_realm = false
	rdns = false
	dns_canonicalize_hostname = false
	allow_weak_crypto = true
	allow_rc4 = true
	permitted_enctypes = @ETYPES@

[realms]
	@REALM@ = {
		kdc = 127.0.0.1
	}

# TEST.LAB -> OTHER.LAB -> THIRD.LAB, see README.md
[capaths]
	TEST.LAB = {
		OTHER.LAB = .
		THIRD.LAB = OTHER.LAB
	}
	OTHER.LAB = {
		THIRD.LAB = .
	}

# makes the KDC answer with a referral when asked for a service of another realm
[domain_realm]
	.test.lab = TEST.LAB
	.other.lab = OTHER.LAB
	.third.lab = THIRD.LAB
