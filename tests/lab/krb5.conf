[libdefaults]
	default_realm = TEST.LAB
	dns_lookup_kdc = false
	dns_lookup_realm = false
	rdns = false
	dns_canonicalize_hostname = false
	allow_weak_crypto = true
	allow_rc4 = true
	permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96 arcfour-hmac

[realms]
	TEST.LAB = {
		kdc = 127.0.0.1
	}
